[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "types-python-snappy"
version = "0.7.3.0"
description = "PEP 561 type stubs for python-snappy"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Matthew Watkins", url = "https://github.com/matthewpwatkins" },
]
requires-python = ">=3.8"
keywords = ["snappy", "compression", "type stubs", "typing", "mypy", "pyright"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Typing :: Stubs Only",
]

[tool.hatch.build.targets.wheel]
# Stub packages must use the hyphenated directory name so pyright discovers them.
# Pyright scans site-packages for *-stubs/ directories; force-include maps our
# source files to the snappy-stubs/ path that pyright recognises for import snappy.
[tool.hatch.build.targets.wheel.force-include]
"snappy_stubs/__init__.pyi" = "snappy-stubs/__init__.pyi"
"snappy_stubs/snappy_formats.pyi" = "snappy-stubs/snappy_formats.pyi"
"snappy_stubs/py.typed" = "snappy-stubs/py.typed"
